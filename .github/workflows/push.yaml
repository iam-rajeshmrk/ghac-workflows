name: Simple Push workflow

on: 
    push:
        branches:
            - main

jobs: 
    build:
        runs-on: ubuntu-latest
        
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '24'

            - name: Install dependencies
              run: npm install
            
            - name: Run build
              run: npm build
